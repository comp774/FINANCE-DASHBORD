<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Inter:wght@200;300;400;500&amp;display=swap" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
/* =====================================================================
   DESIGN SYSTEM · écrit une seule fois, réutilisé partout
   Palette personnalisée : fond #000000 · cartes #4F0000 · texte #F5C971
   principale #FFFFFF · accent #F5C971. Échelle d'espacement de 8 px.
   ===================================================================== */
:root {
  /* Typographie : 2 polices, échelle fixe */
  --police-titre: "Cinzel", "Times New Roman", serif;
  --police-texte: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t-titre: 40px;
  --t-sous-titre: 24px;
  --t-cle: 56px;
  --t-texte: 16px;
  --t-legende: 13px;
  /* Espacements : échelle de 8 px */
  --e1: 8px; --e2: 16px; --e3: 24px; --e4: 32px; --e5: 40px; --e6: 48px; --e8: 64px;
  /* Rayons */
  --r-petit: 8px; --r-moyen: 16px; --r-grand: 24px; --r-pilule: 999px;
  /* Mise en page */
  --rail: 80px;
  --menu-large: 344px;
  --barre-h: 72px;
  --duree: 200ms;
  --courbe: cubic-bezier(.2, .8, .2, 1);
}
/* Mode sombre : la palette personnalisée telle quelle */
[data-theme="sombre"] {
  --c-fond: #000000;
  --c-carte: rgba(79, 0, 0, 0.46);
  --c-carte-pleine: #2a0006;
  --c-carte-survol: rgba(79, 0, 0, 0.62);
  --c-texte: #F5C971;
  --c-texte-doux: #CDB07A;
  --c-principale: #FFFFFF;
  --c-accent: #F5C971;
  --c-accent-texte: #1a0a00;
  --c-bord: rgba(245, 201, 113, 0.20);
  --c-bord-fort: rgba(245, 201, 113, 0.45);
  --c-voile: rgba(0, 0, 0, 0.55);
  --c-grenat: #4F0000;
  --c-grenat-vif: #B0303F;
  --c-particule-1: 176, 48, 63;
  --c-particule-2: 245, 201, 113;
  --c-blob-1: rgba(110, 0, 18, 0.55);
  --c-blob-2: rgba(245, 201, 113, 0.14);
  --c-blob-3: rgba(79, 0, 0, 0.6);
  --c-ombre: 0 24px 48px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(245, 201, 113, 0.10);
  --c-ombre-survol: 0 32px 64px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(245, 201, 113, 0.18);
  /* Signaux sobres : remplissage / texte de badge */
  --s-vert: #5FC48A;   --s-vert-texte: #B9EFCD;   --s-vert-fond: rgba(95, 196, 138, 0.16);
  --s-orange: #F0A44B; --s-orange-texte: #FFD9A8; --s-orange-fond: rgba(240, 164, 75, 0.16);
  --s-rouge: #E2574C;  --s-rouge-texte: #FFC2BC;  --s-rouge-fond: rgba(226, 87, 76, 0.20);
  --s-bleu: #6CA8FF;   --s-bleu-texte: #CFE1FF;   --s-bleu-fond: rgba(108, 168, 255, 0.16);
  --s-gris: #9A9A9A;   --s-gris-texte: #E0E0E0;   --s-gris-fond: rgba(200, 200, 200, 0.12);
  /* Tranches d'âge (graphiques) */
  --g-non-echue: #EDE3CC;
  --g-t1: #F5C971;
  --g-t2: #E8A24E;
  --g-t3: #D46A3E;
  --g-t4: #C0392B;
  --g-serie-1: #F5C971;
  --g-serie-2: #FFFFFF;
  --g-grille: rgba(245, 201, 113, 0.12);
}
/* Mode clair : déclinaison ivoire et grenat de la même palette */
[data-theme="clair"] {
  --c-fond: #FBF6EC;
  --c-carte: rgba(255, 255, 255, 0.62);
  --c-carte-pleine: #FFFFFF;
  --c-carte-survol: rgba(255, 255, 255, 0.82);
  --c-texte: #2B0A0A;
  --c-texte-doux: #6B4A3A;
  --c-principale: #4F0000;
  --c-accent: #F5C971;
  --c-accent-texte: #2B0A0A;
  --c-bord: rgba(79, 0, 0, 0.14);
  --c-bord-fort: rgba(79, 0, 0, 0.35);
  --c-voile: rgba(251, 246, 236, 0.7);
  --c-grenat: #4F0000;
  --c-grenat-vif: #8E1B2B;
  --c-particule-1: 142, 27, 43;
  --c-particule-2: 196, 150, 60;
  --c-blob-1: rgba(176, 48, 63, 0.16);
  --c-blob-2: rgba(245, 201, 113, 0.35);
  --c-blob-3: rgba(255, 255, 255, 0.6);
  --c-ombre: 0 16px 40px rgba(79, 0, 0, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  --c-ombre-survol: 0 24px 56px rgba(79, 0, 0, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --s-vert: #2E8B57;   --s-vert-texte: #14532D;   --s-vert-fond: rgba(46, 139, 87, 0.14);
  --s-orange: #D9822B; --s-orange-texte: #7A3E00; --s-orange-fond: rgba(217, 130, 43, 0.16);
  --s-rouge: #C0392B;  --s-rouge-texte: #8A1C12;  --s-rouge-fond: rgba(192, 57, 43, 0.13);
  --s-bleu: #2F6FD0;   --s-bleu-texte: #173F7A;   --s-bleu-fond: rgba(47, 111, 208, 0.12);
  --s-gris: #7A7A7A;   --s-gris-texte: #3D3D3D;   --s-gris-fond: rgba(0, 0, 0, 0.06);
  --g-non-echue: #CDBFA6;
  --g-t1: #D9A93F;
  --g-t2: #D9822B;
  --g-t3: #B5532A;
  --g-t4: #8E1B2B;
  --g-serie-1: #4F0000;
  --g-serie-2: #C4963C;
  --g-grille: rgba(79, 0, 0, 0.10);
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html.anti-cadre { visibility: hidden; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--c-fond);
  color: var(--c-texte);
  font-family: var(--police-texte);
  font-weight: 300;
  font-size: var(--t-texte);
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--police-titre); font-weight: 400; margin: 0; letter-spacing: .02em; }
h1 { font-size: var(--t-titre); line-height: 1.15; color: var(--c-principale); overflow-wrap: anywhere; }
h2 { font-size: var(--t-sous-titre); line-height: 1.3; }
h3 { font-size: var(--t-texte); font-family: var(--police-texte); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.nombre, .num, td.montant, .kpi-valeur { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.legende { font-size: var(--t-legende); color: var(--c-texte-doux); font-weight: 400; }
.masque-visuel { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; margin: -1px; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 3px; border-radius: 6px; }
[data-theme="clair"] :focus-visible { outline-color: var(--c-grenat-vif); }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ===== Fond animé : particules reliées + liquide ===== */
#fond { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
.liquide { position: fixed; inset: -20%; z-index: -3; pointer-events: none; filter: blur(60px); }
.liquide span { position: absolute; border-radius: 50%; animation: derive 38s ease-in-out infinite alternate; }
.liquide span:nth-child(1) { width: 52vmax; height: 52vmax; left: 0; top: 4%; background: radial-gradient(circle at 40% 40%, var(--c-blob-1), transparent 65%); }
.liquide span:nth-child(2) { width: 40vmax; height: 40vmax; right: 2%; top: 30%; background: radial-gradient(circle at 50% 50%, var(--c-blob-2), transparent 65%); animation-duration: 46s; animation-delay: -12s; }
.liquide span:nth-child(3) { width: 46vmax; height: 46vmax; left: 30%; bottom: -6%; background: radial-gradient(circle at 50% 50%, var(--c-blob-3), transparent 65%); animation-duration: 54s; animation-delay: -24s; }
@keyframes derive {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(6vmax, -4vmax, 0) scale(1.08); }
  100% { transform: translate3d(-5vmax, 5vmax, 0) scale(.95); }
}

/* ===== Structure ===== */
.app { min-height: 100vh; padding-left: var(--rail); }
.colonne { min-width: 0; }
main#contenu { padding: var(--e4) var(--e5) var(--e8); max-width: 1480px; margin: 0 auto; }

/* ===== Menu latéral : rail d'icônes, déplié au survol ===== */
.menu {
  position: fixed; z-index: 40; top: 0; left: 0; bottom: 0;
  width: var(--rail);
  display: flex; flex-direction: column;
  background: var(--c-carte);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  backdrop-filter: blur(22px) saturate(140%);
  border-right: 1px solid var(--c-bord);
  box-shadow: var(--c-ombre);
  transition: width var(--duree) var(--courbe);
  overflow: hidden;
}
[data-theme="sombre"] .menu { background: rgba(20, 0, 3, 0.82); }
[data-theme="clair"] .menu { background: rgba(255, 252, 246, 0.9); }
.menu:hover, .menu:focus-within { width: var(--menu-large); }
.menu-entete { display: flex; align-items: center; gap: var(--e2); padding: var(--e3) 20px var(--e2); min-height: var(--barre-h); }
.logo { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--c-grenat-vif), var(--c-grenat)); color: #F5C971; border: 1px solid var(--c-bord-fort); font-family: var(--police-titre); font-size: 18px; }
.menu-nom { white-space: nowrap; font-family: var(--police-titre); font-size: 15px; line-height: 1.2; color: var(--c-principale); }
.menu-nom small { display: block; font-family: var(--police-texte); font-size: 12px; color: var(--c-texte-doux); letter-spacing: .04em; }
.menu-libelle, .menu-nom, .menu .pastille-mot, .menu .fleche, .menu .sync-detail { opacity: 0; transition: opacity var(--duree) var(--courbe); }
.menu:hover .menu-libelle, .menu:focus-within .menu-libelle, .menu:hover .menu-nom, .menu:focus-within .menu-nom,
.menu:hover .pastille-mot, .menu:focus-within .pastille-mot, .menu:hover .fleche, .menu:focus-within .fleche,
.menu:hover .sync-detail, .menu:focus-within .sync-detail { opacity: 1; }
.menu-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: var(--e1) 12px; scrollbar-width: thin; }
.menu-nav ul { list-style: none; margin: 0; padding: 0; }
.menu-titre { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--c-texte-doux); padding: var(--e2) 14px var(--e1); white-space: nowrap; font-weight: 500; }
.menu:not(:hover):not(:focus-within) .menu-titre { visibility: hidden; }
.menu-ligne { display: flex; align-items: center; border-radius: 12px; position: relative; }
.menu-lien {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px;
  padding: 10px 14px; border-radius: 12px; text-decoration: none; color: var(--c-texte);
  white-space: nowrap; transition: background var(--duree), color var(--duree);
}
.menu-lien:hover { background: var(--c-carte-survol); }
.menu-lien[aria-current="page"] { background: var(--c-accent); color: var(--c-accent-texte); }
.menu-lien[aria-current="page"] .avatar { border-color: var(--c-accent-texte); }
.menu-libelle { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; font-weight: 400; }
.menu-nav > ul + .menu-titre + ul > li > .menu-ligne .menu-libelle, .menu-clients .menu-libelle { white-space: normal; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.avatar { position: relative; width: 26px; height: 26px; flex: none; border-radius: 8px; border: 1px solid var(--c-bord-fort); display: grid; place-items: center; font-size: 11px; font-weight: 500; letter-spacing: .02em; }
.avatar .point { position: absolute; right: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c-carte-pleine); }
.fleche { flex: none; width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; display: grid; place-items: center; cursor: pointer; margin-right: 4px; }
.fleche:hover { background: var(--c-carte-survol); }
.fleche .ico { width: 16px; height: 16px; transition: transform var(--duree) var(--courbe); }
.fleche[aria-expanded="true"] .ico { transform: rotate(90deg); }
.menu-clients { margin: 2px 0 var(--e1) 26px !important; border-left: 1px solid var(--c-bord); padding-left: 6px !important; }
.menu:not(:hover):not(:focus-within) .menu-clients { display: none; }
.menu-clients .menu-lien { padding: 7px 10px; font-size: 14px; gap: 10px; }
.pastille-mot { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; letter-spacing: .03em; padding: 2px 8px; border-radius: var(--r-pilule); }
.point { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.vert .point, .point.vert { background: var(--s-vert); }
.orange .point, .point.orange { background: var(--s-orange); }
.rouge .point, .point.rouge { background: var(--s-rouge); }
.pastille-mot.vert { background: var(--s-vert-fond); color: var(--s-vert-texte); }
.pastille-mot.orange { background: var(--s-orange-fond); color: var(--s-orange-texte); }
.pastille-mot.rouge { background: var(--s-rouge-fond); color: var(--s-rouge-texte); }
.menu-lien[aria-current="page"] .pastille-mot { background: rgba(0,0,0,.12); color: var(--c-accent-texte); }

/* ===== Panneau de synchronisation ===== */
.sync { margin: var(--e1) 12px var(--e2); padding: 14px; border-radius: var(--r-moyen); border: 1px solid var(--c-bord); background: var(--c-carte); position: relative; }
.menu:not(:hover):not(:focus-within) .sync { padding: 14px 0; border-color: transparent; background: transparent; }
.menu:not(:hover):not(:focus-within) .sync-detail { display: none; }
.sync-icone { display: none; width: 40px; height: 40px; margin: 0 auto; border-radius: 12px; border: 1px solid var(--c-bord); place-items: center; position: relative; }
.sync-icone .point { position: absolute; right: -3px; top: -3px; width: 12px; height: 12px; border: 2px solid var(--c-carte-pleine); }
.menu:not(:hover):not(:focus-within) .sync-icone { display: grid; }
.sync-tete { display: flex; align-items: center; justify-content: space-between; gap: var(--e1); }
.interrupteur { display: inline-flex; align-items: center; gap: 10px; background: transparent; border: 0; padding: 4px; cursor: pointer; border-radius: 12px; font-weight: 500; font-size: 14px; }
.piste { position: relative; width: 44px; height: 24px; border-radius: 12px; background: var(--s-gris); transition: background var(--duree) var(--courbe); flex: none; box-shadow: inset 0 1px 3px rgba(0,0,0,.35); }
.rond { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform var(--duree) var(--courbe); }
.interrupteur[aria-checked="true"] .piste { background: var(--c-accent); }
[data-theme="clair"] .interrupteur[aria-checked="true"] .piste { background: var(--c-grenat-vif); }
.interrupteur[aria-checked="true"] .rond { transform: translateX(20px); }
.etat { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 10px; border-radius: var(--r-pilule); font-size: var(--t-legende); font-weight: 400; max-width: 100%; }
.etat .point { width: 9px; height: 9px; }
.etat span:last-child { overflow: hidden; text-overflow: ellipsis; }
.etat--ok { background: var(--s-vert-fond); color: var(--s-vert-texte); }
.etat--ok .point { background: var(--s-vert); animation: pulse 2.4s ease-in-out infinite; }
.etat--pause, .etat--vide { background: var(--s-gris-fond); color: var(--s-gris-texte); }
.etat--pause .point, .etat--vide .point { background: var(--s-gris); }
.etat--lecture { background: var(--s-bleu-fond); color: var(--s-bleu-texte); }
.etat--lecture .point { background: var(--s-bleu); }
.etat--reconnexion { background: var(--s-orange-fond); color: var(--s-orange-texte); }
.etat--reconnexion .point { background: var(--s-orange); }
.etat--erreur { background: var(--s-rouge-fond); color: var(--s-rouge-texte); }
.etat--erreur .point { background: var(--s-rouge); }
.point-ok { background: var(--s-vert); } .point-pause, .point-vide { background: var(--s-gris); } .point-lecture { background: var(--s-bleu); } .point-reconnexion { background: var(--s-orange); } .point-erreur { background: var(--s-rouge); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(95,196,138,.55); } 50% { box-shadow: 0 0 0 6px rgba(95,196,138,0); } }
.sync-raison { margin-top: 6px; font-size: 12px; color: var(--s-rouge-texte); }
.sync-infos { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.sync-infos dt { color: var(--c-texte-doux); }
.sync-infos dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync-boutons { display: grid; gap: var(--e1); margin-top: 12px; }
.sync-note { margin-top: 10px; font-size: 12px; color: var(--c-texte-doux); line-height: 1.4; }
.lien-discret { background: none; border: 0; padding: 4px 0; font-size: 12px; color: var(--c-texte-doux); text-decoration: underline; cursor: pointer; margin-top: 8px; }

/* ===== Boutons ===== */
.bouton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--c-bord-fort); background: transparent; cursor: pointer; font-size: 14px; font-weight: 500; text-decoration: none; transition: background var(--duree), transform var(--duree), box-shadow var(--duree); white-space: nowrap; }
.bouton:hover { background: var(--c-carte-survol); }
.bouton:active { transform: translateY(1px); }
.bouton--principal { background: var(--c-accent); color: var(--c-accent-texte); border-color: transparent; box-shadow: 0 8px 24px rgba(245, 201, 113, 0.22); }
.bouton--principal:hover { background: #F8D88F; }
.bouton--petit { min-height: 32px; padding: 4px 12px; font-size: 13px; }
.bouton .ico { width: 18px; height: 18px; }

/* ===== Barre du haut ===== */
.barre { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: var(--e3); min-height: var(--barre-h); padding: 12px var(--e5); background: var(--c-voile); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-bottom: 1px solid var(--c-bord); }
.ariane { flex: 1; min-width: 0; }
.ariane ol { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0; padding: 0; font-size: 14px; }
.ariane li { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.ariane li + li::before { content: "›"; color: var(--c-texte-doux); }
.ariane a { text-decoration: none; color: var(--c-texte-doux); border-radius: 4px; }
.ariane a:hover { color: var(--c-texte); text-decoration: underline; }
.ariane [aria-current] { color: var(--c-principale); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.segments { display: inline-flex; padding: 4px; border-radius: var(--r-pilule); border: 1px solid var(--c-bord); background: var(--c-carte); }
.segments button { border: 0; background: transparent; padding: 6px 14px; border-radius: var(--r-pilule); cursor: pointer; font-size: 13px; font-weight: 400; color: var(--c-texte-doux); transition: background var(--duree), color var(--duree); }
.segments button[aria-pressed="true"] { background: var(--c-principale); color: var(--c-fond); font-weight: 500; }
.theme { position: relative; display: inline-flex; align-items: center; width: 76px; height: 36px; border-radius: var(--r-pilule); border: 1px solid var(--c-bord-fort); background: var(--c-carte); cursor: pointer; padding: 0; flex: none; }

/* ===== Cartes ===== */

.mini-jauge { width: 100%; max-width: 200px; height: auto; display: block; margin: 0 auto; }

.info { position: relative; display: inline-flex; }

.info > button .ico { width: 16px; height: 16px; }
.bulle { position: absolute; z-index: 20; right: 0; top: calc(100% + 8px); width: 280px; max-width: 78vw; padding: 12px 14px; border-radius: 12px; background: var(--c-carte-pleine); border: 1px solid var(--c-bord-fort); box-shadow: 0 16px 40px rgba(0,0,0,.45); font-size: 13px; line-height: 1.45; color: var(--c-texte); opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity var(--duree), transform var(--duree), visibility var(--duree); pointer-events: none; text-transform: none; letter-spacing: 0; font-weight: 400; }
.info:hover .bulle, .info:focus-within .bulle { opacity: 1; visibility: visible; transform: translateY(0); }
.flash { animation: flash 2s ease-out 1; }
@keyframes flash { 0% { box-shadow: 0 0 0 2px var(--c-accent), 0 0 42px rgba(245, 201, 113, .55); } 100% { box-shadow: var(--c-ombre); } }

.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pilule); font-size: 12px; font-weight: 500; letter-spacing: .02em; white-space: nowrap; border: 1px solid transparent; }

.point-att .titre-att { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 500; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--c-texte-doux); }

/* Graphiques */

.graph-carte h3 { margin-bottom: 4px; }

.graph-vide { height: 340px; display: grid; place-items: center; text-align: center; color: var(--c-texte-doux); }

/* Tableau premium */
.outils { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: var(--e2); }
.recherche { position: relative; flex: 1 1 220px; max-width: 360px; }
.recherche .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--c-texte-doux); }
.recherche input { width: 100%; min-height: 40px; padding: 8px 12px 8px 40px; border-radius: 12px; border: 1px solid var(--c-bord); background: var(--c-carte); color: var(--c-texte); font: inherit; font-size: 14px; }
.recherche input::placeholder { color: var(--c-texte-doux); opacity: .85; }
.puces { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.puce { border: 1px solid var(--c-bord); background: transparent; border-radius: var(--r-pilule); padding: 6px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

.outils .espace { flex: 1; }

table.premium td { padding: 12px 14px; border-bottom: 1px solid var(--c-bord); vertical-align: middle; }

@keyframes scintille { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.etat-ecran { max-width: 720px; margin: var(--e6) auto; text-align: center; padding: var(--e5) var(--e4); }
.etat-ecran .grand-ico { width: 64px; height: 64px; margin: 0 auto var(--e3); border-radius: 20px; display: grid; place-items: center; background: var(--c-carte-survol); border: 1px solid var(--c-bord); }

.zone-depot { margin: var(--e3) 0; padding: var(--e4); border: 1.5px dashed var(--c-bord-fort); border-radius: var(--r-grand); display: grid; gap: var(--e2); justify-items: center; }

.onglets-bas { display: none; }

@media (max-width: 1100px) {
  .grille-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .reponse-texte { font-size: 20px; min-width: 0; }

  .toasts { right: 16px; bottom: 96px; }
  .tuile-valeur { font-size: 28px; }
  /* Tableau en cartes sur téléphone : aucun défilement horizontal */
  .tableau-cadre { border: 0; overflow: visible; }
  table.premium, table.premium tbody, table.premium tfoot, table.premium tr, table.premium td { display: block; width: 100%; }
  table.premium thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  table.premium tr { border: 1px solid var(--c-bord); border-radius: var(--r-moyen); margin-bottom: 12px; padding: 6px 0; background: var(--c-carte); }

  table.premium td::before { content: attr(data-libelle); color: var(--c-texte-doux); font-size: 12px; text-align: left; letter-spacing: .04em; }

  .recherche { max-width: none; }
}

}

}

  /* Cherche la ligne d'en-têtes dans les 10 premières lignes */

  /* Lit le tableau des factures */

      var ligne = lignesTrouvees[L];

      var compteurLigne = { erreurs: 0, formules: 0 };
      spec.colonnes.forEach(function (col) { brut[col.cle] = carte[col.cle] === undefined ? null : valeur(ligne[carte[col.cle]], compteurLigne); });

      f.numero = brut.numero === null ? null : String(brut.numero).trim();

      f.montant = lireNombre(brut.montant);

      f.encaisse = brut.encaisse === null ? 0 : lireNombre(brut.encaisse);
      f.bu = brut.bu === null ? null : String(brut.bu).trim();

      else if (!f.numero) { probleme = 'N° de facture'; }
      else if (f.date === null) { probleme = 'Date de facture'; }

  /* Lit le référentiel des clients (bloc à droite de l'onglet Data ou onglet séparé) */

  /* =====================================================================
     4. CALCULS (une fonction par calcul, simple à vérifier)
     ===================================================================== */

  /* Début de la période : 12 mois glissants = lendemain de la clôture moins 12 mois */
  function debutPeriode(cloture, nbMois) {
    var d = utcDepuisSerie(cloture);

  /* Échéance, solde, état, retard et tranche d'une facture (mêmes règles que l'onglet Data) */
  function enrichirFacture(f, referentiel, cloture) {
    var ref = referentiel.get(cleTexte(f.client));
    var x = Object.create(null);
    Object.keys(f).forEach(function (k) { x[k] = f[k]; });
    x.bu = (ref && ref.bu) || f.bu || 'Client inconnu';
    x.conditions = ref && ref.conditions !== null ? ref.conditions : (f.conditions !== null ? f.conditions : null);
    x.echeance = x.conditions !== null ? f.date + x.conditions : (f.echeance !== null ? f.echeance : f.date);

    x.etat = x.solde <= 0 ? 'Soldée' : (x.echeance < cloture ? 'Échue' : 'Non échue');
    x.retard = x.etat === 'Échue' ? cloture - x.echeance : 0;

    return x;
  }
  function trancheAge(f) {
    if (f.solde <= 0) { return 'Soldée'; }
    if (f.retard === 0) { return 'Non échue'; }
    if (f.retard <= 30) { return '1-30 j'; }
    if (f.retard <= 60) { return '31-60 j'; }
    if (f.retard <= 90) { return '61-90 j'; }
    return 'Plus de 90 j';
  }
  /* CA TTC de la période : factures émises entre le début et la clôture */
  function chiffreAffaires(factures, debut, cloture) { return somme(factures, function (f) { return f.date >= debut && f.date <= cloture ? f.montant : 0; }); }
  function encaissePeriode(factures, debut, cloture) { return somme(factures, function (f) { return f.date >= debut && f.date <= cloture ? f.encaisse : 0; }); }
  function encours(factures) { return somme(factures, function (f) { return f.solde; }); }
  function encoursEtat(factures, etat) { return somme(factures, function (f) { return f.etat === etat ? f.solde : 0; }); }
  function encoursTranche(factures, tranche) { return somme(factures, function (f) { return f.tranche === tranche ? f.solde : 0; }); }
  /* DSO = encours ÷ CA de la période × nombre de jours */
  function dso(enc, ca, nbJours) { return ca ? enc / ca * nbJours : 0; }
  /* Taux de recouvrement = encaissé ÷ facturé, sur les factures échues à la clôture */
  function tauxRecouvrement(factures, cloture) {
    var fact = somme(factures, function (f) { return f.echeance < cloture ? f.montant : 0; });

  }
  /* Indice d'impact = part de l'encours × DSO du client ÷ DSO cible × 100 */
  function indiceImpact(part, dsoClient, cible) { return cible ? part * dsoClient / cible * 100 : 0; }
  /* Trésorerie libérable = MAX(0 ; encours − DSO cible ÷ jours × CA) */
  function tresorerieLiberable(enc, ca, cible, nbJours) { return Math.max(0, enc - cible / nbJours * ca); }
  function statutDso(v, p) { return v <= p.dsoCible ? 'vert' : (v <= p.dsoRouge ? 'orange' : 'rouge'); }
  function statutTaux(v, p) { return v >= p.trVert ? 'vert' : (v >= p.trRouge ? 'orange' : 'rouge'); }
  function statutP90(v, p) { return v <= p.p90Vert ? 'vert' : (v <= p.p90Rouge ? 'orange' : 'rouge'); }
  function statutAdd(v, p) { return v <= p.addVert ? 'vert' : (v <= p.addRouge ? 'orange' : 'rouge'); }
  function statutImpact(v, p) { return v < p.impOrange ? 'vert' : (v < p.impRouge ? 'orange' : 'rouge'); }
  /* Encours en alerte : vert sous 25 %, orange de 25 à 50 %, rouge au-delà (hypothèse documentée) */
  function statutAlerte(part) { return part < 0.25 ? 'vert' : (part <= 0.5 ? 'orange' : 'rouge'); }

  /* Piste d'audit : doublons et anomalies, comme les colonnes de contrôle du fichier */
  function piste(factures) {
    var compte = new Map();
    factures.forEach(function (f) { compte.set(f.numero, (compte.get(f.numero) || 0) + 1); });
    var doublons = factures.filter(function (f) { return compte.get(f.numero) > 1; }).length;
    var anomalies = factures.filter(function (f) {
      var s = normaliser(f.statut);
      return f.encaisse > f.montant || f.encaisse < 0 || (s === 'payee' && f.solde !== 0) || (s === 'non payee' && f.encaisse !== 0);

    var controle = Math.round((somme(factures, function (f) { return f.montant; }) - somme(factures, function (f) { return f.encaisse; }) - encours(factures)) * 100) / 100;

  /* Construit le modèle complet affiché par l'application */
  function construireModele(brut, cleperiode) {
    var p = brut.params;
    var cloture = brut.cloture;
    var nbMois = PERIODES[cleperiode].mois;
    var debut = debutPeriode(cloture, nbMois);
    var nbJours = cloture - debut + 1;
    var refMap = new Map();
    brut.referentiel.forEach(function (r) { refMap.set(cleTexte(r.client), r); });
    var factures = brut.factures.map(function (f) { return enrichirFacture(f, refMap, cloture); });

    var g = {};
    g.ca = chiffreAffaires(factures, debut, cloture);
    g.encaisse = encaissePeriode(factures, debut, cloture);
    g.encours = encours(factures);
    g.echu = encoursEtat(factures, 'Échue');
    g.nonEchu = encoursEtat(factures, 'Non échue');
    g.dso = dso(g.encours, g.ca, nbJours);
    g.bpdso = dso(g.nonEchu, g.ca, nbJours);
    g.add = g.dso - g.bpdso;
    g.taux = tauxRecouvrement(factures, cloture);
    g.p90Montant = encoursTranche(factures, 'Plus de 90 j');
    g.p90 = g.encours ? g.p90Montant / g.encours : 0;
    g.immobilise = Math.max(0, g.encours - p.dsoCible / nbJours * g.ca);
    g.ecart = g.dso - p.dsoCible;
    g.tranches = TRANCHES.map(function (t) { return { tranche: t, montant: encoursTranche(factures, t) }; });
    g.factureTotal = somme(factures, function (f) { return f.montant; });
    g.encaisseTotal = somme(factures, function (f) { return f.encaisse; });
    g.statutDso = statutDso(g.dso, p);
    g.statutTaux = statutTaux(g.taux, p);
    g.statutP90 = statutP90(g.p90, p);
    g.statutAdd = statutAdd(g.add, p);

    /* Clients : référentiel d'abord, puis clients trouvés seulement dans les factures */
    var ordreClients = [];
    var vus = new Set();
    brut.referentiel.forEach(function (r) { var k = cleTexte(r.client); if (!vus.has(k)) { vus.add(k); ordreClients.push({ nom: r.client, bu: r.bu || 'Client inconnu', ville: r.ville, conditions: r.conditions, code: r.code }); } });
    factures.forEach(function (f) { var k = cleTexte(f.client); if (!vus.has(k)) { vus.add(k); ordreClients.push({ nom: f.client, bu: f.bu, ville: '', conditions: f.conditions, code: '' }); } });
    var slugsVus = new Set();
    var clients = ordreClients.map(function (c) {
      var fc = factures.filter(function (f) { return cleTexte(f.client) === cleTexte(c.nom); });
      var x = {};
      x.nom = c.nom; x.bu = c.bu; x.ville = c.ville || ''; x.code = c.code || ''; x.conditions = c.conditions;
      x.slug = slug(c.nom); while (slugsVus.has(x.slug)) { x.slug += '-b'; } slugsVus.add(x.slug);
      x.factures = fc;
      x.ca = chiffreAffaires(fc, debut, cloture);
      x.encours = encours(fc);
      x.echu = encoursEtat(fc, 'Échue');
      x.nonEchu = encoursEtat(fc, 'Non échue');
      x.p90 = encoursTranche(fc, 'Plus de 90 j');
      x.dso = dso(x.encours, x.ca, nbJours);
      x.ecart = x.dso - p.dsoCible;
      x.part = g.encours ? x.encours / g.encours : 0;
      x.indice = indiceImpact(x.part, x.dso, p.dsoCible);
      x.liberable = tresorerieLiberable(x.encours, x.ca, p.dsoCible, nbJours);
      x.statutDso = statutDso(x.dso, p);
      x.statut = statutImpact(x.indice, p);
      x.tranches = TRANCHES.map(function (t) { return { tranche: t, montant: encoursTranche(fc, t) }; });

    });
    /* Rang d'impact sur l'ensemble des clients */

    /* Business Units */
    var nomsBU = [];
    clients.forEach(function (c) { if (nomsBU.indexOf(c.bu) === -1) { nomsBU.push(c.bu); } });
    var bus = nomsBU.map(function (nom) {
      var fb = factures.filter(function (f) { return f.bu === nom; });
      var b = { nom: nom, slug: slug(nom) };
      b.ca = chiffreAffaires(fb, debut, cloture);
      b.encours = encours(fb);
      b.echu = encoursEtat(fb, 'Échue');
      b.nonEchu = encoursEtat(fb, 'Non échue');
      b.dso = dso(b.encours, b.ca, nbJours);
      b.bpdso = dso(b.nonEchu, b.ca, nbJours);
      b.add = b.dso - b.bpdso;
      b.ecart = b.dso - p.dsoCible;
      b.part = g.encours ? b.encours / g.encours : 0;
      b.taux = tauxRecouvrement(fb, cloture);
      b.p90Montant = encoursTranche(fb, 'Plus de 90 j');
      b.p90 = b.encours ? b.p90Montant / b.encours : 0;
      b.statut = statutDso(b.dso, p);
      b.facture = somme(fb, function (f) { return f.montant; });
      b.encaisse = somme(fb, function (f) { return f.encaisse; });
      b.tranches = TRANCHES.map(function (t) { return { tranche: t, montant: encoursTranche(fb, t) }; });
      b.clients = clients.filter(function (c) { return c.bu === nom; }).sort(function (a, c) { return c.indice - a.indice; });
      b.abrege = abreger(nom);
      return b;
    }).sort(function (a, b) { return b.dso - a.dso; });
    var alerte = clients.filter(function (c) { return c.statut === 'rouge'; });
    g.alerteMontant = somme(alerte, function (c) { return c.encours; });
    g.alerteNb = alerte.length;
    g.alertePart = g.encours ? g.alerteMontant / g.encours : 0;
    g.statutAlerte = statutAlerte(g.alertePart);

    var modele = {
      brut: brut, params: p, periode: cleperiode, cloture: cloture, debut: debut, nbJours: nbJours,

  /* 3 points d'attention rédigés par des règles simples (aucune IA, aucun appel réseau) */
  function pointsAttention(m) {
    var g = m.global, p = m.params, candidats = [];
    var poids = { rouge: 3, orange: 2, vert: 1 };
    if (g.dso > p.dsoCible) {
      candidats.push({ ordre: 1, statut: g.statutDso, titre: 'Niveau du DSO',
        texte: 'Le DSO global atteint ' + formatJours(g.dso) + ' pour une cible de ' + formatJours(p.dsoCible) + ' : écart de ' + formatEntier(g.ecart) + ' jours, soit ' + formatMillions(g.immobilise) + ' de trésorerie immobilisée. ' + formatEntier(g.add) + ' de ces jours viennent des retards de paiement.' });
    } else {
      candidats.push({ ordre: 1, statut: 'vert', titre: 'Niveau du DSO', texte: 'Le DSO global (' + formatJours(g.dso) + ') respecte la cible de ' + formatJours(p.dsoCible) + '.' });
    }
    var top = m.clients.slice().sort(function (a, b) { return b.indice - a.indice; }).slice(0, 3).filter(function (c) { return c.encours > 0; });
    if (top.length) {

      var lib = somme(top, function (c) { return c.liberable; });

        texte: listeNoms(top.map(function (c) { return c.nom; })) + ' portent ' + formatPct(part, 0) + ' de l\'encours. Ramener leur DSO à ' + formatJours(p.dsoCible) + ' libérerait ' + formatMillions(lib) + ' de trésorerie.' });
    }
    if (g.p90Montant > 0) {
      candidats.push({ ordre: 3, statut: g.statutP90, titre: 'Créances de plus de 90 jours',
        texte: 'Elles représentent ' + formatPct(g.p90, 1) + ' de l\'encours, soit ' + formatMAD(g.p90Montant) + '. En récupérer ' + formatPct(p.hypRecup, 0) + ' en 60 jours apporterait ' + formatMAD(g.p90Montant * p.hypRecup) + '.' });
    }

      candidats.push({ ordre: 4, statut: pire.statut, titre: 'Business Unit à surveiller',

    }
    if (g.taux < p.trVert) {
      candidats.push({ ordre: 5, statut: g.statutTaux, titre: 'Efficacité du recouvrement',
        texte: 'Le taux de recouvrement des factures échues est de ' + formatPct(g.taux, 1) + ', sous l\'objectif de ' + formatPct(p.trVert, 0) + ' : ' + formatMillions(g.echu) + ' restent dus sur des factures échues.' });
    }
    return candidats.sort(function (a, b) { return poids[b.statut] - poids[a.statut] || a.ordre - b.ordre; }).slice(0, 3).sort(function (a, b) { return a.ordre - b.ordre; });
  }
  function listeNoms(noms) { return noms.length < 2 ? noms.join('') : noms.slice(0, -1).join(', ') + ' et ' + noms[noms.length - 1]; }

  /* Différences entre deux versions des données (résumé du changement) */

  /* =====================================================================
     5. FORMATS À LA FRANÇAISE
     ===================================================================== */
  var fmt0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
  var fmt1 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var fmt2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function formatDecimal(v, d) { return espaces((d === 2 ? fmt2 : d === 1 ? fmt1 : fmt0).format(v)); }
  function formatMAD(v) { return formatEntier(v) + ' MAD'; }
  function formatMillions(v) {
    var a = Math.abs(v);
    if (a >= 1e6) { return formatDecimal(v / 1e6, a >= 1e8 ? 0 : 2) + ' M MAD'; }
    if (a >= 1e3) { return formatDecimal(v / 1e3, 0) + ' k MAD'; }
    return formatMAD(v);
  }
  function formatMillionsCourt(v) { var a = Math.abs(v); return a >= 1e6 ? formatDecimal(v / 1e6, 1) + ' M' : a >= 1e3 ? formatDecimal(v / 1e3, 0) + ' k' : formatEntier(v); }

  function formatPct(v, d) { return formatDecimal(v * 100, d === undefined ? 1 : d) + ' %'; }
  function signe(v) { var n = Math.round(v); return (n > 0 ? '+' : n < 0 ? '−' : '') + formatEntier(Math.abs(n)); }
  function formatDate(serie) { if (serie === null || serie === undefined) { return '—'; } var d = utcDepuisSerie(serie); return pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear(); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function formatHeure(d) { return d.getHours() + ' h ' + pad(d.getMinutes()); }

  /* =====================================================================

  var ETAT = {
    brut: null, modele: null, empreinte: null,
    periode: 'annee',
    tables: Object.create(null),
    menuOuvert: new Set(),
    alertes: [], avertissements: [],
    erreurEcran: null,
    chargement: true,
    flash: new Set(),

  };
  var SYNC = {
    actif: stockage.lire(CONFIG.cleSync) !== '0',
    mode: null,               // 'direct' (A), 'enligne' (B), 'import' (C)
    poignee: null,
    poigneeEnAttente: null,
    nomFichier: '',
    derniereMaj: null,
    etat: 'vide', raison: '',
    minuteur: null, enCours: false, aRefaire: false,

  /* Empreinte SHA-256 (Web Crypto) ; repli FNV-1a si Web Crypto est indisponible */

  function definirEtat(etat, raison) {

  function texteEtat() {

  function libelleMode() {

  /* Traite les octets d'un fichier : vérification, lecture, validation complète, puis remplacement */

  function valeursKpi(m) {

    m.bus.forEach(function (b) { v['bu-ca-' + b.slug] = b.ca; v['bu-encours-' + b.slug] = b.encours; v['bu-echu-' + b.slug] = b.echu; v['bu-dso-' + b.slug] = b.dso; v['bu-part-' + b.slug] = b.part; });

  /* Mode A · Direct : relit le fichier connecté via l'API File System Access (lecture seule) */
  function verifierDirect() {
    var p = SYNC.poignee;
    return p.getFile().then(function (f) {
      if (SYNC.signature && f.lastModified === SYNC.signature.date && f.size === SYNC.signature.taille) { return null; }

  /* Fichier illisible pendant l'enregistrement : 3 nouveaux essais en 1 seconde */

  /* --- Tableau premium : tri, recherche, puces, total, export Excel --- */
  function tableau(o) {
    var st = ETAT.tables[o.id] || (ETAT.tables[o.id] = { recherche: '', puce: 'tous', tri: o.triDefaut });
    var conteneur = el('div', null);
    var outils = el('div', { 'class': 'outils' });
    var champ = el('input', { type: 'search', id: o.id + '-recherche', placeholder: 'Rechercher…', 'aria-label': 'Rechercher dans le tableau', autocomplete: 'off', spellcheck: 'false', maxlength: '80' });

    if (o.puces) {
      var groupe = el('div', { 'class': 'puces', role: 'group', 'aria-label': 'Filtrer par statut' });
      [['tous', 'Tous'], ['vert', MOTS_STATUT.vert], ['orange', MOTS_STATUT.orange], ['rouge', MOTS_STATUT.rouge]].forEach(function (pc) {
        groupe.appendChild(el('button', { type: 'button', 'class': 'puce', 'aria-pressed': st.puce === pc[0] ? 'true' : 'false',

          pc[0] !== 'tous' ? el('span', { 'class': 'point ' + pc[0], 'aria-hidden': 'true' }) : null, pc[1]));
      });
      outils.appendChild(groupe);
    }
    outils.appendChild(el('span', { 'class': 'espace' }));
    outils.appendChild(el('button', { type: 'button', 'class': 'bouton bouton--petit', onclick: function () { exporter(o, filtrer()); } }, icone('export'), 'Exporter en Excel'));
    conteneur.appendChild(outils);

    var table = el('table', { 'class': 'premium', 'aria-label': o.libelle });
    var trh = el('tr', null);
    o.colonnes.forEach(function (col) {
      var droite = estNumerique(col.type);
      var th = el('th', { scope: 'col', 'class': droite ? 'droite' : null, 'aria-sort': st.tri && st.tri.cle === col.cle ? (st.tri.sens === 'asc' ? 'ascending' : 'descending') : 'none' });

        st.tri = { cle: col.cle, sens: st.tri && st.tri.cle === col.cle && st.tri.sens === 'desc' ? 'asc' : 'desc' };
        trh.querySelectorAll('th').forEach(function (x, i) { x.setAttribute('aria-sort', o.colonnes[i].cle === st.tri.cle ? (st.tri.sens === 'asc' ? 'ascending' : 'descending') : 'none'); });
        remplir();
      } }, col.libelle, icone('tri')));
      trh.appendChild(th);
    });
    table.appendChild(el('thead', null, trh));

    table.appendChild(corps); table.appendChild(pied);
    conteneur.appendChild(el('div', { 'class': 'tableau-cadre' }, table));

    function filtrer() {
      var q = normaliser(st.recherche);
      var lignes = o.lignes.filter(function (l) {
        if (q && normaliser(o.recherche(l)).indexOf(q) === -1) { return false; }
        if (o.puces && st.puce !== 'tous' && o.puces(l) !== st.puce) { return false; }
        return true;
      });
      if (st.tri) {
        var cle = st.tri.cle, sens = st.tri.sens === 'asc' ? 1 : -1;
        lignes = lignes.slice().sort(function (a, b) {
          var x = a[cle], y = b[cle];
          if (cle === 'statut' && o.puces) { x = { vert: 1, orange: 2, rouge: 3 }[x] || 0; y = { vert: 1, orange: 2, rouge: 3 }[y] || 0; }
          if (cle === 'tranche') { x = TRANCHES.indexOf(x); y = TRANCHES.indexOf(y); }
          if (typeof x === 'string' || typeof y === 'string') { return sens * String(x || '').localeCompare(String(y || ''), 'fr'); }

    }

        corps.appendChild(tr);

      var tf = el('tr', null);
      o.colonnes.forEach(function (col, i) {
        var td;
        if (i === 0) { td = el('td', { 'data-libelle': 'Total', text: 'Total (' + pluriel(lignes.length, 'ligne') + ')' }); }

  }
  function estNumerique(type) { return ['montant', 'jours', 'pct', 'decimal', 'entier', 'ecart'].indexOf(type) > -1; }
  function cellule(col, v, ligne) {
    var td = el('td', { 'data-libelle': col.libelle, 'class': estNumerique(col.type) ? 'droite montant num' : null });
    switch (col.type) {
      case 'montant': td.textContent = formatEntier(v || 0); break;
      case 'jours': td.textContent = v === null || v === undefined ? '—' : formatEntier(v) + ' j'; break;
      case 'ecart': td.textContent = signe(v) + ' j'; break;
      case 'pct': td.textContent = formatPct(v || 0, 1); break;
      case 'decimal': td.textContent = formatDecimal(v || 0, 1); break;
      case 'entier': td.textContent = formatEntier(v || 0); break;
      case 'date': td.textContent = formatDate(v); break;
      case 'statut': td.appendChild(badge(v)); break;
      case 'tranche': td.appendChild(badgeTranche(v)); break;
      case 'nom': td.appendChild(el('span', { 'class': 'nom-cellule', text: v })); break;
      default: td.textContent = v === null || v === undefined ? '' : String(v);
    }
    return td;
  }
  function badgeTranche(t) {

    var ico = c === 'gris' ? 'ok' : c === 'bleu' ? 'horloge' : c === 'vert' ? 'ok' : 'alerte';
    return el('span', { 'class': 'badge ' + c }, icone(ico), t);
  }
  /* Export Excel : valeurs brutes, textes neutralisés contre les formules piégées */
  function exporter(o, lignes) {

    var entetes = o.colonnes.map(function (c) { return neutraliserCellule(c.libelle); });
    var donnees = lignes.map(function (l) {
      return o.colonnes.map(function (c) {
        var v = l[c.cle];
        if (c.type === 'statut') { return neutraliserCellule(MOTS_STATUT[v] || ''); }
        if (c.type === 'date') { return neutraliserCellule(formatDate(v)); }
        if (c.type === 'pct') { return typeof v === 'number' ? Math.round(v * 10000) / 100 : v; }
        if (typeof v === 'number') { return Math.round(v * 100) / 100; }
        return neutraliserCellule(v === null || v === undefined ? '' : String(v));

  }

    };
  }
  /* Barres empilées : l'encours et sa composition par tranche d'âge */
  function optionEmpilees(m) {
    var cats = m.bus.map(function (b) { return b.nom; }).concat(['Total']);
    var couleurs = couleursTranches();
    return {
      color: couleurs,
      legend: { bottom: 0, textStyle: axeTexte(), itemWidth: 12, itemHeight: 12, icon: 'roundRect' },
      grid: { left: 8, right: 16, top: 16, bottom: 56, containLabel: true },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: function (pts) {
        var t = 0; pts.forEach(function (x) { t += x.value; });
        return '<div style="margin-bottom:6px;font-weight:500">' + echapper(pts[0].name) + '</div>' + pts.map(function (x) { return ligneInfo(x.seriesName, formatMAD(x.value), x.color); }).join('') + ligneInfo('Total', formatMAD(t));
      } },
      xAxis: { type: 'value', axisLabel: Object.assign(axeTexte(), { formatter: function (v) { return formatMillionsCourt(v); } }), splitLine: grilleLignes() },
      yAxis: { type: 'category', data: cats, inverse: true, axisLabel: Object.assign(axeTexte(), { width: 130, overflow: 'break' }), axisLine: { show: false }, axisTick: { show: false } },
      series: TRANCHES.map(function (t, i) {
        return { name: t, type: 'bar', stack: 'encours', barWidth: 22, emphasis: { focus: 'series' },
          itemStyle: { borderColor: couleur('--c-fond'), borderWidth: 1 },
          data: m.bus.map(function (b) { return b.tranches[i].montant; }).concat([m.global.tranches[i].montant]) };
      })
    };
  }
  /* Sankey : d'où vient l'argent, où il va */
  function optionSankey(m) {
    var g = m.global, nodes = [], liens = [];
    var couleurs = couleursTranches();
    function noeud(nom, c) { nodes.push({ name: nom, itemStyle: { color: c, borderColor: c } }); }
    m.bus.forEach(function (b) { noeud(b.nom, couleur('--c-grenat-vif')); liens.push({ source: b.nom, target: 'Facturé', value: b.facture }); });
    noeud('Facturé', couleur('--c-accent'));
    noeud('Encaissé', couleursStatut('vert'));
    liens.push({ source: 'Facturé', target: 'Encaissé', value: g.encaisseTotal });
    if (g.nonEchu > 0) { noeud('Encours non échu', couleurs[0]); liens.push({ source: 'Facturé', target: 'Encours non échu', value: g.nonEchu }); }
    if (g.echu > 0) {
      noeud('Encours échu', couleursStatut('orange'));
      liens.push({ source: 'Facturé', target: 'Encours échu', value: g.echu });
      TRANCHES.slice(1).forEach(function (t, i) { var v = g.tranches[i + 1].montant; if (v > 0) { noeud(t, couleurs[i + 1]); liens.push({ source: 'Encours échu', target: t, value: v }); } });
    }
    return {
      tooltip: { trigger: 'item', formatter: function (x) {
        if (x.dataType === 'edge') { return ligneInfo(x.data.source + ' → ' + x.data.target, formatMAD(x.data.value)); }
        return ligneInfo(x.name, formatMAD(x.value));
      } },
      series: [{
        type: 'sankey', left: 8, right: 110, top: 12, bottom: 12, nodeGap: 12, nodeWidth: 14, draggable: false,
        emphasis: { focus: 'adjacency' },
        lineStyle: { color: 'gradient', opacity: 0.35, curveness: 0.5 },
        label: { color: couleur('--c-texte'), fontSize: 12, formatter: function (x) { return x.name + '\n' + formatMillionsCourt(x.value); } },
        data: nodes, links: liens
      }]
    };
  }
  /* Barres horizontales : classement des clients par indice d'impact */
  function optionImpact(b, p) {
    var clients = b.clients.slice().reverse();
    var max = Math.max(p.impRouge * 1.5, Math.ceil(Math.max.apply(null, clients.map(function (c) { return c.indice; }).concat([0])) * 1.1));
    return {
      grid: { left: 8, right: 48, top: 16, bottom: 24, containLabel: true },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: function (pts) { var c = clients[pts[0].dataIndex]; return ligneInfo(c.nom, formatDecimal(c.indice, 1)) + ligneInfo('DSO', formatJours(c.dso)) + ligneInfo('Encours', formatMAD(c.encours)); } },
      xAxis: { type: 'value', max: max, axisLabel: axeTexte(), splitLine: grilleLignes() },
      yAxis: { type: 'category', data: clients.map(function (c) { return c.nom; }), axisLabel: Object.assign(axeTexte(), { width: 140, overflow: 'truncate' }), axisLine: { show: false }, axisTick: { show: false } },
      series: [{
        type: 'bar', barWidth: 14,
        data: clients.map(function (c) { return { value: Math.round(c.indice * 10) / 10, itemStyle: { color: couleursStatut(c.statut), borderRadius: [0, 7, 7, 0] } }; }),
        label: { show: true, position: 'right', color: couleur('--c-principale'), formatter: function (x) { return formatDecimal(x.value, 1); } },
        markLine: { silent: true, symbol: 'none', label: { color: couleur('--c-texte-doux'), formatter: function (x) { return String(x.value); } }, lineStyle: { type: 'dashed' },
          data: [{ xAxis: p.impOrange, lineStyle: { color: couleursStatut('orange') } }, { xAxis: p.impRouge, lineStyle: { color: couleursStatut('rouge') } }] }
      }]
    };
  }
  /* Combiné barres + courbe : encours en barres, DSO en courbe, cible 60 j */
  function optionCombine(b, p) {
    var clients = b.clients;
    return {
      color: [couleur('--g-serie-1'), couleur('--g-serie-2')],
      legend: { bottom: 0, textStyle: axeTexte(), data: ['Encours', 'DSO'] },
      grid: { left: 8, right: 8, top: 32, bottom: 72, containLabel: true },
      tooltip: { trigger: 'axis', formatter: function (pts) {
        var c = clients[pts[0].dataIndex];
        return '<div style="margin-bottom:6px;font-weight:500">' + echapper(c.nom) + '</div>' + ligneInfo('Encours', formatMAD(c.encours)) + ligneInfo('DSO', formatJours(c.dso)) + ligneInfo('Cible', formatJours(p.dsoCible));
      } },
      xAxis: { type: 'category', data: clients.map(function (c) { return c.nom; }), axisLabel: Object.assign(axeTexte(), { interval: 0, rotate: 32, width: 90, overflow: 'truncate' }), axisTick: { show: false } },
      yAxis: [
        { type: 'value', name: 'MAD', nameTextStyle: axeTexte(), axisLabel: Object.assign(axeTexte(), { formatter: function (v) { return formatMillionsCourt(v); } }), splitLine: grilleLignes() },
        { type: 'value', name: 'jours', nameTextStyle: axeTexte(), axisLabel: axeTexte(), splitLine: { show: false } }
      ],
      series: [
        { name: 'Encours', type: 'bar', barWidth: '46%', itemStyle: { borderRadius: [6, 6, 0, 0] }, data: clients.map(function (c) { return c.encours; }) },
        { name: 'DSO', type: 'line', yAxisIndex: 1, smooth: true, symbolSize: 8, lineStyle: { width: 2 }, data: clients.map(function (c) { return Math.round(c.dso); }),
          markLine: { silent: true, symbol: 'none', lineStyle: { color: couleursStatut('rouge'), type: 'dashed', width: 2 }, label: { formatter: 'Cible ' + p.dsoCible + ' j', color: couleur('--c-texte'), position: 'insideEndTop' }, data: [{ yAxis: p.dsoCible }] } }
      ]
    };
  }
  /* Donut : part de chaque tranche d'âge (5 parts) */
  function optionDonut(tranches) {
    var total = somme(tranches, function (t) { return t.montant; });
    return {
      color: couleursTranches(),
      tooltip: { trigger: 'item', formatter: function (x) { return ligneInfo(x.name, formatMAD(x.value)) + ligneInfo('Part', formatPct(total ? x.value / total : 0, 1)); } },
      legend: { bottom: 0, textStyle: axeTexte(), itemWidth: 12, itemHeight: 12, icon: 'circle' },
      series: [{
        type: 'pie', radius: ['52%', '76%'], center: ['50%', '44%'], avoidLabelOverlap: true,
        itemStyle: { borderColor: couleur('--c-fond'), borderWidth: 2, borderRadius: 6 },
        label: { show: true, position: 'center', formatter: function () { return formatMillionsCourt(total) + '\nMAD'; }, fontSize: 22, fontWeight: 200, color: couleur('--c-principale'), lineHeight: 26 },
        emphasis: { scale: true, scaleSize: 6 },
        labelLine: { show: false },
        data: tranches.map(function (t) { return { name: t.tranche, value: t.montant }; })
      }]
    };
  }
  /* Radar : la BU face à la moyenne de l'entreprise sur 5 critères */
  function optionRadar(b, m) {
    var g = m.global, moyennePart = m.bus.length ? 1 / m.bus.length : 0;
    var maxDso = Math.max(b.dso, g.dso, m.params.dsoRouge) * 1.2;
    var maxAdd = Math.max(b.add, g.add, m.params.addRouge) * 1.2;
    var maxP90 = Math.max(b.p90, g.p90, m.params.p90Rouge) * 1.2;
    var ind = [
      { name: 'DSO (j)', max: maxDso }, { name: 'Retard moyen (j)', max: maxAdd }, { name: 'Taux de recouvrement', max: 1 },
      { name: 'Part > 90 j', max: maxP90 }, { name: 'Part de l\'encours', max: 1 }];
    var vb = [b.dso, b.add, b.taux, b.p90, b.part];
    var ve = [g.dso, g.add, g.taux, g.p90, moyennePart];
    var formats = [function (v) { return formatJours(v); }, function (v) { return formatJours(v); }, function (v) { return formatPct(v, 1); }, function (v) { return formatPct(v, 1); }, function (v) { return formatPct(v, 1); }];
    return {
      color: [couleur('--g-serie-1'), couleur('--g-serie-2')],
      legend: { bottom: 0, textStyle: axeTexte(), data: [b.nom, 'Moyenne entreprise'] },
      tooltip: { trigger: 'item', formatter: function (x) { var v = x.dataIndex === 0 ? vb : ve; return '<div style="margin-bottom:6px;font-weight:500">' + echapper(x.name) + '</div>' + ind.map(function (i, k) { return ligneInfo(i.name, formats[k](v[k])); }).join(''); } },
      radar: { indicator: ind, radius: '62%', center: ['50%', '48%'], axisName: { color: couleur('--c-texte-doux'), fontSize: 11 }, splitLine: grilleLignes(), splitArea: { show: false }, axisLine: grilleLignes() },
      series: [{ type: 'radar', symbolSize: 6, areaStyle: { opacity: 0.18 }, data: [
        { name: b.nom, value: vb },
        { name: 'Moyenne entreprise', value: ve, lineStyle: { type: 'dashed' } }] }]
    };
  }
  /* Barres empilées : chaque facture, encaissé et reste dû */
  function optionFactures(c) {
    var fs = c.factures.slice().sort(function (a, b) { return a.date - b.date; });
    return {
      color: [couleursStatut('vert'), couleursStatut('rouge')],
      legend: { bottom: 0, textStyle: axeTexte(), data: ['Encaissé', 'Reste dû'] },
      grid: { left: 8, right: 8, top: 16, bottom: 72, containLabel: true },
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: function (pts) {
        var f = fs[pts[0].dataIndex];
        return '<div style="margin-bottom:6px;font-weight:500">' + echapper(f.numero) + ' · ' + echapper(formatDate(f.date)) + '</div>' + ligneInfo('Encaissé', formatMAD(f.encaisse)) + ligneInfo('Reste dû', formatMAD(f.solde)) + ligneInfo('Tranche', f.tranche);
      } },
      xAxis: { type: 'category', data: fs.map(function (f) { return f.numero; }), axisLabel: Object.assign(axeTexte(), { interval: 0, rotate: 32 }), axisTick: { show: false } },
      yAxis: { type: 'value', axisLabel: Object.assign(axeTexte(), { formatter: function (v) { return formatMillionsCourt(v); } }), splitLine: grilleLignes() },
      series: [
        { name: 'Encaissé', type: 'bar', stack: 'f', barWidth: '50%', data: fs.map(function (f) { return Math.max(0, f.encaisse); }) },
        { name: 'Reste dû', type: 'bar', stack: 'f', itemStyle: { borderRadius: [6, 6, 0, 0] }, data: fs.map(function (f) { return Math.max(0, f.solde); }) }
      ]
    };
  }

  /* =====================================================================
     9. FOND ANIMÉ : particules reliées grenat et or
     ===================================================================== */
  var fond = (function () {
    var canvas = document.getElementById('fond');
    var ctx = canvas.getContext('2d');
    var particules = [], largeur = 0, hauteur = 0, ratio = 1, boucle = null, visible = true;
    function telephone() { return window.matchMedia('(max-width: 768px)').matches; }
    function statique() { return REDUIRE.matches || telephone(); }
    function initialiser() {
      ratio = Math.min(window.devicePixelRatio || 1, 2);
      largeur = window.innerWidth; hauteur = window.innerHeight;
      canvas.width = largeur * ratio; canvas.height = hauteur * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      var n = Math.round(Math.min(90, Math.max(28, largeur * hauteur / 22000)));
      particules = [];
      for (var i = 0; i < n; i++) {
        particules.push({ x: Math.random() * largeur, y: Math.random() * hauteur, vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22, r: Math.random() * 1.8 + 0.6, or: Math.random() < 0.45 });
      }
    }
    function dessiner() {
      ctx.clearRect(0, 0, largeur, hauteur);
      var c1 = couleur('--c-particule-1'), c2 = couleur('--c-particule-2');
      var distance = 140;
      for (var i = 0; i < particules.length; i++) {
        var a = particules[i];
        for (var j = i + 1; j < particules.length; j++) {
          var b = particules[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.sqrt(dx * dx + dy * dy);
          if (d < distance) {
            ctx.strokeStyle = 'rgba(' + (a.or && b.or ? c2 : c1) + ',' + (0.22 * (1 - d / distance)).toFixed(3) + ')';
            ctx.lineWidth = 0.7;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      particules.forEach(function (p) {
        ctx.fillStyle = 'rgba(' + (p.or ? c2 : c1) + ',' + (p.or ? 0.75 : 0.85) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      });
    }
    function avancer() {
      particules.forEach(function (p) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < -10) { p.x = largeur + 10; } if (p.x > largeur + 10) { p.x = -10; }
        if (p.y < -10) { p.y = hauteur + 10; } if (p.y > hauteur + 10) { p.y = -10; }
      });
    }
    function tour() { if (!visible) { boucle = null; return; } avancer(); dessiner(); boucle = requestAnimationFrame(tour); }
    function demarrerFond() {
      if (boucle) { cancelAnimationFrame(boucle); boucle = null; }
      initialiser();
      document.documentElement.classList.toggle('sans-animation', REDUIRE.matches);
      if (statique()) { dessiner(); } else { boucle = requestAnimationFrame(tour); }
    }
    document.addEventListener('visibilitychange', function () { visible = !document.hidden; if (visible && !boucle && !statique()) { boucle = requestAnimationFrame(tour); } });
    return { demarrer: demarrerFond, redessiner: function () { if (statique()) { dessiner(); } } };
  })();

  /* =====================================================================
     10. DÉMARRAGE ET ÉVÉNEMENTS
     ===================================================================== */
  (function themeInitial() {
    var t = stockage.lire(CONFIG.cleTheme);
    document.documentElement.setAttribute('data-theme', t === 'clair' ? 'clair' : 'sombre');
  })();

  window.addEventListener('hashchange', function () { ETAT.flash = new Set(); ETAT.animerChiffres = true; rendre(); window.scrollTo(0, 0); var m = document.getElementById('contenu'); if (m) { m.focus({ preventScroll: true }); } });
  var minuteurRedim = null;
  window.addEventListener('resize', function () {
    clearTimeout(minuteurRedim);
    minuteurRedim = setTimeout(function () { graphiques.forEach(function (g) { g.resize(); }); fond.demarrer(); }, 200);
  });
  if (REDUIRE.addEventListener) { REDUIRE.addEventListener('change', function () { fond.demarrer(); rendre({ conserverDefilement: true }); }); }
  /* Onglet revenu au premier plan : vérification immédiate */
  document.addEventListener('visibilitychange', function () { if (!document.hidden && SYNC.actif) { verifier().then(planifier); } });
  /* Mise à jour du « il y a 12 s » */
  setInterval(function () { if (SYNC.etat === 'ok') { majTexteSync(); } }, 1000);

  document.getElementById('selecteur-fichier').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    importerFichier(f);
  });

  /* Glisser-déposer : connecté en direct si le navigateur le permet (getAsFileSystemHandle) */
  var voile = document.getElementById('depot-voile'), profondeur = 0;
  function contientFichier(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') > -1; }
  window.addEventListener('dragenter', function (e) { if (!contientFichier(e)) { return; } e.preventDefault(); profondeur++; voile.classList.add('actif'); });
  window.addEventListener('dragover', function (e) { if (!contientFichier(e)) { return; } e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  window.addEventListener('dragleave', function (e) { if (!contientFichier(e)) { return; } profondeur = Math.max(0, profondeur - 1); if (!profondeur) { voile.classList.remove('actif'); } });
  window.addEventListener('drop', function (e) {
    if (!contientFichier(e)) { return; }
    e.preventDefault(); profondeur = 0; voile.classList.remove('actif');
    var item = e.dataTransfer.items && e.dataTransfer.items[0];
    var fichier = e.dataTransfer.files && e.dataTransfer.files[0];
    if (!fichier) { return; }
    if (CONFIG.extensions.indexOf(extension(fichier.name)) === -1) { toast('Format refusé : seuls les fichiers .xlsx, .xlsm, .xls et .csv sont acceptés.', 'erreur'); return; }
    if (item && typeof item.getAsFileSystemHandle === 'function') {
      item.getAsFileSystemHandle().then(function (p) {
        if (p && p.kind === 'file') { return connecterPoignee(p); }
        importerFichier(fichier);
      }).catch(function () { importerFichier(fichier); });
    } else { importerFichier(fichier); }
  });

  fond.demarrer();
  demarrer();
})();
</script>
